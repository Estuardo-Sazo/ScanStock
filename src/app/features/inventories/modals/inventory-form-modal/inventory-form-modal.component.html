<ion-content fullscreen class="bg-slate-50">
  <div class="bg-slate-50">

    <div
      class="sticky top-0 z-20 flex items-start justify-between border-b border-slate-200 bg-white/90 px-5 pb-5 pt-6 backdrop-blur-xl"
    >
      <div>
        <h2 class="text-4xl font-bold tracking-tight text-slate-900">
          @if (isEditing) {
            Editar Inventario
          } @else {
            Nuevo Inventario
          }
        </h2>
      </div>

      <button
        (click)="closeModal()"
        class="flex h-11 w-11 items-center justify-center rounded-full bg-slate-100 text-slate-500 transition active:scale-95"
      >
        <ion-icon name="close" class="text-2xl"></ion-icon>
      </button>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="space-y-8 p-5 pb-40"
    >


      <div>
        <label class="mb-3 block text-sm font-semibold text-slate-700">
          Nombre del Inventario
        </label>

        <div class="relative">
          <ion-icon
            name="create-outline"
            class="absolute left-4 top-1/2 -translate-y-1/2 text-xl text-slate-400"
          ></ion-icon>

          <input
            type="text"
            formControlName="name"
            placeholder="e.g. Warehouse A - Q1"
            class="w-full rounded-3xl border-2 border-slate-200 bg-white py-5 pl-12 pr-4 text-lg text-slate-900 outline-none transition focus:border-blue-600"
          />
        </div>
      </div>


      <div>
        <label class="mb-3 block text-sm font-semibold text-slate-700">
          Descripción
        </label>

        <textarea
          rows="5"
          formControlName="description"
          placeholder="Optional inventory notes"
          class="w-full rounded-3xl border-2 border-slate-200 bg-white p-5 text-slate-900 outline-none transition focus:border-blue-600"
        ></textarea>
      </div>


      <div class="flex gap-4 rounded-3xl border border-blue-100 bg-blue-50 p-5">
        <ion-icon
          name="information-circle-outline"
          class="mt-0.5 text-2xl text-blue-600"
        ></ion-icon>

        <p class="text-sm leading-6 text-blue-700">
          Esta sesión de inventario almacena todos los productos escaneados
          localmente en este dispositivo.
        </p>
      </div>
    </form>

  </div>
</ion-content>
<ion-footer class="border-t border-slate-200 bg-white">
  <div class="p-5 pb-8">

    <button
      type="submit"
      [disabled]="form.invalid || isLoading"
      (click)="onSubmit()"
      class="flex h-14 w-full items-center justify-center gap-2 rounded-2xl bg-blue-600 px-6 text-base font-semibold text-white shadow-lg shadow-blue-200/50 transition-all duration-200 active:scale-[0.98] disabled:opacity-50 disabled:shadow-none"
    >
      @if (isLoading) {
        <span> Guardando... </span>
      } @else {
        <ion-icon name="play-outline" class="text-xl"></ion-icon>

        <span>
          @if (isEditing) {
            Actualizar Inventario
          } @else {
            Crear Inventario
          }
        </span>
      }
    </button>

    <button
      (click)="closeModal()"
      class="mt-4 w-full text-center font-medium text-slate-500"
    >
      Cancelar
    </button>
  </div>
</ion-footer>
