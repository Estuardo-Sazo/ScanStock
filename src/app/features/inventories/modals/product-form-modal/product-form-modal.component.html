<ion-content fullscreen>
  <div class="flex min-h-screen flex-col bg-slate-50">

    <!-- Header -->
    <div class="flex items-start justify-between border-b border-slate-100 bg-white px-5 pb-5 pt-6">
      <div>
        <span class="inline-flex items-center gap-1.5 rounded-full bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-700">
          <ion-icon name="alert-circle-outline" class="text-sm"></ion-icon>
          Producto no encontrado
        </span>
        <h1 class="mt-3 text-2xl font-bold text-slate-900">Crear producto</h1>
        <p class="mt-1 text-sm text-slate-500">Completa los datos para continuar</p>
      </div>

      <button
        (click)="close()"
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-slate-100 text-slate-500 transition active:bg-slate-200"
      >
        <ion-icon name="close-outline" class="text-xl"></ion-icon>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex-1 space-y-5 p-5">

      <!-- Barcode -->
      <div>
        <label class="mb-1.5 block text-sm font-semibold text-slate-700">
          Código de barras
        </label>
        <div class="relative">
          <ion-icon
            name="barcode-outline"
            class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-lg text-slate-400"
          ></ion-icon>
          <input
            type="text"
            formControlName="barcode"
            placeholder="Ej: 7501234567890"
            class="w-full rounded-2xl border bg-white py-4 pl-11 pr-4 text-sm text-slate-900 outline-none transition"
            [class.border-slate-200]="!form.get('barcode')?.invalid || !form.get('barcode')?.touched"
            [class.focus:border-blue-400]="!form.get('barcode')?.invalid"
            [class.border-red-300]="form.get('barcode')?.invalid && form.get('barcode')?.touched"
            [class.focus:ring-2]="true"
            [class.focus:ring-blue-100]="!form.get('barcode')?.invalid"
            [class.focus:ring-red-100]="form.get('barcode')?.invalid && form.get('barcode')?.touched"
          />
        </div>
        @if(form.get('barcode')?.invalid && form.get('barcode')?.touched) {
          <p class="mt-1.5 text-xs text-red-500">El código de barras es requerido</p>
        }
      </div>

      <!-- Name -->
      <div>
        <label class="mb-1.5 block text-sm font-semibold text-slate-700">
          Nombre del producto <span class="text-red-400">*</span>
        </label>
        <div class="relative">
          <ion-icon
            name="cube-outline"
            class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-lg text-slate-400"
          ></ion-icon>
          <input
            type="text"
            formControlName="name"
            placeholder="Ej: Coca Cola 600ml"
            class="w-full rounded-2xl border bg-white py-4 pl-11 pr-4 text-sm text-slate-900 outline-none transition"
            [class.border-slate-200]="!form.get('name')?.invalid || !form.get('name')?.touched"
            [class.border-red-300]="form.get('name')?.invalid && form.get('name')?.touched"
          />
        </div>
        @if(form.get('name')?.invalid && form.get('name')?.touched) {
          <p class="mt-1.5 text-xs text-red-500">El nombre es requerido (mínimo 2 caracteres)</p>
        }
      </div>

      <!-- SKU -->
      <div>
        <label class="mb-1.5 block text-sm font-semibold text-slate-700">
          SKU interno
          <span class="ml-1 font-normal text-slate-400">(opcional)</span>
        </label>
        <div class="relative">
          <ion-icon
            name="pricetag-outline"
            class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-lg text-slate-400"
          ></ion-icon>
          <input
            type="text"
            formControlName="sku"
            placeholder="Ej: PROD-001"
            class="w-full rounded-2xl border border-slate-200 bg-white py-4 pl-11 pr-4 text-sm text-slate-900 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
          />
        </div>
      </div>

    </form>

    <!-- Footer -->
    <div class="border-t border-slate-100 bg-white px-5 py-4">
      <button
        (click)="submit()"
        [disabled]="form.invalid || isLoading"
        class="w-full rounded-2xl bg-blue-600 py-4 text-base font-semibold text-white shadow-sm shadow-blue-200 transition active:bg-blue-700 disabled:opacity-40"
      >
        @if(isLoading) {
          Guardando...
        } @else {
          Guardar producto
        }
      </button>
    </div>

  </div>
</ion-content>
