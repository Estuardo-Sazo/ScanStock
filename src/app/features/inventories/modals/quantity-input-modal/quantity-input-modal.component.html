<ion-content fullscreen>
  <div class="flex min-h-screen flex-col bg-slate-50">

    <!-- Header -->
    <div class="flex items-start justify-between border-b border-slate-100 bg-white px-5 pb-5 pt-6">
      <div class="min-w-0 flex-1">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">
          {{ mode === 'set' ? 'Editar cantidad' : 'Producto encontrado' }}
        </p>
        <h1 class="mt-2 truncate text-2xl font-bold text-slate-900">{{ productName }}</h1>
        @if(barcode) {
          <p class="mt-1 text-sm text-slate-400">{{ barcode }}</p>
        }
        @if(mode === 'set') {
          <p class="mt-1 text-xs text-slate-400">
            Cantidad actual: <span class="font-semibold text-slate-600">{{ currentQuantity }}</span>
          </p>
        }
      </div>

      <button
        (click)="close()"
        class="ml-3 flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-slate-100 text-slate-500 transition active:bg-slate-200"
      >
        <ion-icon name="close-outline" class="text-xl"></ion-icon>
      </button>
    </div>

    <!-- Quantity input -->
    <div class="flex-1 p-5">
      <p class="mb-3 text-xs font-semibold uppercase tracking-wider text-slate-400">
        {{ mode === 'set' ? 'Nueva cantidad total' : 'Cantidad a agregar' }}
      </p>

      <input
        type="number"
        [(ngModel)]="quantity"
        min="0"
        class="w-full rounded-2xl border-2 border-slate-200 bg-white p-5 text-center text-6xl font-bold text-blue-600 outline-none transition focus:border-blue-400 focus:ring-4 focus:ring-blue-50"
      />

      <!-- Quick add buttons -->
      <div class="mt-4 grid grid-cols-3 gap-3">
        @for(val of [1, 5, 10]; track val) {
          <button
            (click)="increase(val)"
            class="rounded-2xl border border-slate-200 bg-white py-4 text-sm font-semibold text-slate-700 shadow-sm transition active:scale-95 active:bg-slate-50"
          >
            +{{ val }}
          </button>
        }
      </div>
    </div>

    <!-- Footer -->
    <div class="border-t border-slate-100 bg-white px-5 py-4">
      <button
        (click)="confirm()"
        class="w-full rounded-2xl bg-blue-600 py-4 text-base font-semibold text-white shadow-sm shadow-blue-200 transition active:bg-blue-700"
      >
        {{ confirmLabel }}
      </button>
    </div>

  </div>
</ion-content>
