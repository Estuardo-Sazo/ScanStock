<ion-content fullscreen>
  <div class="flex min-h-screen flex-col bg-slate-50">
    <!-- Header -->
    <div class="flex items-start justify-between border-b border-slate-200 bg-white px-5 pb-5 pt-6">
      <div>
        <p class="text-sm text-slate-500">
          {{ mode === 'set' ? 'Editar cantidad' : 'Producto encontrado' }}
        </p>
        <h1 class="mt-2 text-3xl font-bold text-slate-900">{{ productName }}</h1>
        @if(barcode) {
          <p class="mt-1 text-sm text-slate-500">{{ barcode }}</p>
        }
        @if(mode === 'set') {
          <p class="mt-1 text-sm text-slate-400">Actual: {{ currentQuantity }} unidades</p>
        }
      </div>
      <button
        (click)="close()"
        class="flex h-11 w-11 items-center justify-center rounded-full bg-slate-100"
      >
        <ion-icon name="close-outline" class="text-2xl"></ion-icon>
      </button>
    </div>

    <!-- Quantity -->
    <div class="flex-1 p-5">
      <p class="text-sm font-semibold text-slate-500">
        {{ mode === 'set' ? 'Nueva cantidad total' : 'Cantidad a agregar' }}
      </p>

      <input
        type="number"
        [(ngModel)]="quantity"
        min="0"
        class="mt-3 w-full rounded-3xl border-2 border-slate-200 bg-white p-6 text-center text-6xl font-bold text-blue-600 outline-none focus:border-blue-400"
      />

      <!-- Quick Buttons -->
      <div class="mt-5 grid grid-cols-3 gap-3">
        <button
          (click)="increase(1)"
          class="rounded-2xl bg-white py-4 font-semibold text-slate-700 shadow-sm active:bg-slate-100"
        >
          +1
        </button>
        <button
          (click)="increase(5)"
          class="rounded-2xl bg-white py-4 font-semibold text-slate-700 shadow-sm active:bg-slate-100"
        >
          +5
        </button>
        <button
          (click)="increase(10)"
          class="rounded-2xl bg-white py-4 font-semibold text-slate-700 shadow-sm active:bg-slate-100"
        >
          +10
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="border-t border-slate-200 bg-white p-5">
      <button
        (click)="confirm()"
        class="w-full rounded-full bg-blue-600 py-5 text-lg font-bold text-white active:bg-blue-700"
      >
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</ion-content>
