<div class="px-5 py-3">
  <div class="flex items-center gap-2">

    <!-- Input -->
    <div class="relative flex-1">
      <ion-icon
        name="search-outline"
        class="absolute left-4 top-1/2 -translate-y-1/2 text-lg text-slate-400 pointer-events-none"
      ></ion-icon>

      <input
        type="text"
        [(ngModel)]="query"
        (input)="onSearchChange()"
        placeholder="Buscar por nombre, SKU o código"
        class="w-full rounded-2xl border border-slate-200 bg-white py-3.5 pl-11 pr-4 text-sm text-slate-900 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
      />
    </div>

    <!-- Scan button -->
    <button
      (click)="openScanner()"
      class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-blue-600 text-white shadow-sm shadow-blue-200 transition active:scale-95"
      title="Escanear código"
    >
      <ion-icon name="scan-outline" class="text-xl"></ion-icon>
    </button>

  </div>
</div>
