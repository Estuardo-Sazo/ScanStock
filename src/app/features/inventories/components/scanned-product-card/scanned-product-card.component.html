<div class="rounded-3xl bg-white p-5 shadow-sm">
  <div class="flex items-start justify-between">
    <!-- Info -->

    <div>
      <h2 class="text-lg font-bold text-slate-900">
        {{ item.productNameSnapshot }}
      </h2>

      <p class="mt-1 text-sm text-slate-500">
        SKU:
        {{ item.skuSnapshot }}
      </p>
    </div>

    <!-- Quantity -->

    <div class="text-right">
      <p class="text-3xl font-bold text-blue-600">
        {{ item.quantity }}
      </p>

      <p class="text-xs text-slate-500">units</p>
    </div>
  </div>

  <!-- Actions -->

  <div class="mt-5 flex justify-end gap-3">
    <button
      (click)="edit.emit(item)"
      class="flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-50 text-blue-600"
    >
      <ion-icon name="create-outline"></ion-icon>
    </button>

    <button
      (click)="delete.emit(item)"
      class="flex h-11 w-11 items-center justify-center rounded-2xl bg-red-50 text-red-500"
    >
      <ion-icon name="trash-outline"></ion-icon>
    </button>
  </div>
</div>
