<div class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
  <div class="flex items-start justify-between gap-3">

    <!-- Info -->
    <div class="min-w-0 flex-1">
      <h2 class="truncate text-base font-semibold text-slate-900">
        {{ item.productNameSnapshot || 'Producto sin nombre' }}
      </h2>

      @if(item.skuSnapshot || item.barcodeSnapshot) {
        <p class="mt-0.5 text-xs text-slate-400">
          {{ item.skuSnapshot ? 'SKU: ' + item.skuSnapshot : item.barcodeSnapshot }}
        </p>
      }
    </div>

    <!-- Quantity badge -->
    <div class="flex flex-col items-end shrink-0">
      <span class="text-3xl font-bold text-blue-600 leading-none">{{ item.quantity }}</span>
      <span class="mt-0.5 text-[10px] font-medium uppercase tracking-wider text-slate-400">uds.</span>
    </div>

  </div>

  <!-- Actions -->
  <div class="mt-4 flex justify-end gap-2 border-t border-slate-50 pt-3">
    <button
      (click)="edit.emit(item)"
      class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-50 text-blue-600 transition active:scale-95"
      title="Editar cantidad"
    >
      <ion-icon name="create-outline" class="text-lg"></ion-icon>
    </button>

    <button
      (click)="delete.emit(item)"
      class="flex h-9 w-9 items-center justify-center rounded-xl bg-red-50 text-red-500 transition active:scale-95"
      title="Eliminar"
    >
      <ion-icon name="trash-outline" class="text-lg"></ion-icon>
    </button>
  </div>
</div>
