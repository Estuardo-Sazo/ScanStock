<div class="sticky top-0 z-20 border-b border-slate-100 bg-white/90 px-5 pb-4 pt-5 backdrop-blur-xl">
  <div class="flex items-start justify-between gap-3">

    <div class="min-w-0 flex-1">
      <h1 class="truncate text-2xl font-bold text-slate-900">{{ inventory.name }}</h1>
      <p class="mt-0.5 text-sm text-slate-400">
        {{ inventory.createdAt | date:'dd MMM yyyy' }}
      </p>
    </div>

    <div class="flex shrink-0 items-center gap-2 pt-0.5">
      <span [class]="statusClass">{{ statusLabel }}</span>
      <button
        (click)="options.emit()"
        class="flex h-8 w-8 items-center justify-center rounded-xl bg-slate-100 text-slate-500 transition active:bg-slate-200"
      >
        <ion-icon name="ellipsis-vertical-outline" style="font-size: 16px;"></ion-icon>
      </button>
    </div>

  </div>
</div>
