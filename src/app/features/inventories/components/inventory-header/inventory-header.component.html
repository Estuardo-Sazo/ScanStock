<div class="sticky top-0 z-20 border-b border-slate-100 bg-white/90 px-5 pb-4 pt-5 backdrop-blur-xl">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h1 class="truncate text-2xl font-bold text-slate-900">{{ inventory.name }}</h1>
      <p class="mt-0.5 text-sm text-slate-400">
        {{ inventory.createdAt | date:'dd MMM yyyy' }}
      </p>
    </div>

    <span class="shrink-0 rounded-full bg-blue-50 px-3 py-1.5 text-xs font-semibold text-blue-700">
      Activo
    </span>
  </div>
</div>
