<div
  (click)="goToInventory()"
  class="relative overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100 transition-all active:scale-[0.99] active:shadow-none"
>
  <!-- Color accent top bar -->
  <div class="h-1 w-full" [ngClass]="sidebarColor"></div>

  <div class="p-4">
    <!-- Row 1: nombre + acciones -->
    <div class="flex items-start justify-between gap-2">
      <h2 class="text-base font-bold text-slate-900 leading-snug">{{ displayName }}</h2>

      <div class="flex shrink-0 items-center gap-1">
        <!-- Badge estado -->
        <span
          class="rounded-full px-2 py-0.5 text-[11px] font-semibold"
          [ngClass]="{
            'bg-blue-50 text-blue-700': status === 'active',
            'bg-green-50 text-green-700': status === 'synced'
          }"
        >
          {{ status === 'active' ? 'Activo' : 'Sincronizado' }}
        </span>

        <!-- Editar -->
        <ion-button
          fill="clear"
          color="medium"
          size="small"
          (click)="onEditClick($event)"
          style="--padding-start: 4px; --padding-end: 4px;"
        >
          <ion-icon slot="icon-only" name="ellipsis-horizontal-outline" style="font-size: 18px;"></ion-icon>
        </ion-button>
      </div>
    </div>

    <!-- Row 2: fecha -->
    <p class="mt-0.5 text-xs text-slate-400">{{ displayDate }}</p>

    <!-- Divider -->
    <div class="my-3 h-px bg-slate-50"></div>

    <!-- Row 3: stats + chevron -->
    <div class="flex items-end justify-between">
      <div class="flex items-baseline gap-3">
        <div>
          <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Productos</p>
          <p class="mt-0.5 text-3xl font-bold text-slate-900">{{ displayTotal }}</p>
        </div>
      </div>

      <ion-icon name="arrow-forward-outline" class="text-slate-300" style="font-size: 18px;"></ion-icon>
    </div>
  </div>
</div>
