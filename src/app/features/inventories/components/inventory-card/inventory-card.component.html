<div
  (click)="goToInventory()"
  class="relative overflow-hidden rounded-2xl border border-slate-100 bg-white shadow-sm transition-all duration-150 active:scale-[0.99] active:shadow-none"
>
  <!-- Color accent -->
  <div class="absolute left-0 top-0 h-full w-1" [ngClass]="sidebarColor"></div>

  <div class="px-5 py-5 pl-6">
    <!-- Top row -->
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h2 class="truncate text-lg font-bold text-slate-900">{{ displayName }}</h2>
        <p class="mt-0.5 text-xs text-slate-400">{{ displayDate }}</p>
      </div>

      <div class="flex shrink-0 items-center gap-2">
        <!-- Badge -->
        <span
          class="rounded-full px-2.5 py-1 text-xs font-semibold"
          [ngClass]="{
            'bg-blue-50 text-blue-700': status === 'active',
            'bg-green-50 text-green-700': status === 'synced'
          }"
        >
          {{ status === 'active' ? 'Activo' : 'Sincronizado' }}
        </span>

        <!-- Edit -->
        <button
          (click)="onEditClick($event)"
          class="flex h-8 w-8 items-center justify-center rounded-xl bg-slate-50 text-slate-500 transition hover:bg-blue-50 hover:text-blue-600 active:scale-95"
          title="Editar"
        >
          <ion-icon name="create-outline" class="text-base"></ion-icon>
        </button>
      </div>
    </div>

    <!-- Stats row -->
    <div class="mt-4 flex items-end justify-between border-t border-slate-50 pt-4">
      <div>
        <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">
          Productos escaneados
        </p>
        <h3 class="mt-1 text-4xl font-bold text-slate-900">{{ displayTotal }}</h3>
      </div>

      <ion-icon name="chevron-forward-outline" class="text-lg text-slate-300"></ion-icon>
    </div>
  </div>
</div>
