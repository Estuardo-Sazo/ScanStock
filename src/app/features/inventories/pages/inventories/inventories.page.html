<ion-content fullscreen>
  <div class="min-h-screen bg-slate-50 pb-32">
    <!-- Header -->
    <div
      class="sticky top-0 z-30 flex items-center justify-between border-b border-slate-200 bg-white/80 px-5 py-4 backdrop-blur-xl"
    >
      <div>
        <h1 class="text-3xl font-bold text-blue-700">Inventarios</h1>

        <p class="mt-1 text-sm text-slate-500">Administra tus conteos de inventario</p>
      </div>

      <button
        class="flex h-10 w-10 items-center justify-center rounded-full text-slate-500"
      >
        ⋮
      </button>
    </div>

    <!-- Content -->
    <div class="flex flex-col gap-5 p-5">
      <!-- Loading -->
      @if(isLoading) {

      <div class="flex items-center justify-center py-16">
        <p class="text-slate-500">Cargando inventarios...</p>
      </div>

      }

      <!-- Empty -->
      @else if(inventories.length === 0) {

      <div class="flex flex-col items-center justify-center py-16 text-center">
        <p class="mb-5 text-slate-500">No hay inventarios creados</p>

        <button (click)="openCreateModal()" class="btn-primary px-6 py-3 h-12 w-auto">
          Crear Inventario
        </button>
      </div>

      }

      <!-- List -->
      @else { @for( inventory of inventories; track inventory.id ) {

      <app-inventory-card
        [inventory]="inventory"
        (onEdit)="openEditModal($event)"
        (onDelete)="deleteInventory($event.id!)"
      />

      } }
    </div>
  </div>

  <app-floating-action-button (clickFab)="openCreateModal()" />

  <app-bottom-navbar />
</ion-content>
